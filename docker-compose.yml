version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: stationSki
      MYSQL_ROOT_PASSWORD: root  # Set the root password
      # Remove MYSQL_USER and MYSQL_PASSWORD as they are not needed for root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  spring_app:
    image: rezguimedamine/gestion-station-ski:1.0
    container_name: gestion_station_ski
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/stationSki?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root  # Must match MYSQL_ROOT_PASSWORD
      SPRING_DATASOURCE_PASSWORD: root    # Must match MYSQL_ROOT_PASSWORD
      SERVER_PORT: 8089
      SERVER_SERVLET_CONTEXT_PATH: /api
    ports:
      - "8089:8089"

volumes:
  mysql_data:
